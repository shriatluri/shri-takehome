name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: kyc_owner
          POSTGRES_PASSWORD: kyc_owner_pw
          POSTGRES_DB: kyc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyc_owner -d kyc"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: kyc
      DB_OWNER_USER: kyc_owner
      DB_OWNER_PASSWORD: kyc_owner_pw
      DB_APP_USER: kyc_app
      DB_APP_PASSWORD: kyc_app_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
